name: Releases to CurseForge and/or Modrinth

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: 9.5.0
        name: Set up Gradle

      - name: Resolve release version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          # Sort without the optional v prefix, retaining the original tag for checkout.
          mapfile -t TAGS < <(
            git tag --list |
              awk '/^v?[0-9]+\.[0-9]+\.[0-9]+$/ {
                version = $0
                sub(/^v/, "", version)
                print version, $0
              }' |
              LC_ALL=C sort -k1,1Vr -k2,2 |
              awk '!seen[$1]++ { print $2 }'
          )
          if (( ${#TAGS[@]} == 0 )); then
            echo "::error::No release tag found; expected 1.2.3 or v1.2.3."
            exit 1
          fi
          TAG="${TAGS[0]}"
          PREVIOUS_TAG="${TAGS[1]:-}"
          git checkout --detach "refs/tags/$TAG"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "value=${TAG#v}" >> "$GITHUB_OUTPUT"
          echo "previous_tag=$PREVIOUS_TAG" >> "$GITHUB_OUTPUT"

      - name: Get Changes between Tags
        id: changes
        shell: bash
        env:
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
          PREVIOUS_TAG: ${{ steps.version.outputs.previous_tag }}
        run: |
          set -euo pipefail
          CHANGELOG_FILE="$RUNNER_TEMP/ric-release-changelog.md"
          if [[ -n "$PREVIOUS_TAG" ]]; then
            git log --pretty=format:'- %h %s' "refs/tags/$PREVIOUS_TAG..refs/tags/$RELEASE_TAG" > "$CHANGELOG_FILE"
          else
            git log --pretty=format:'- %h %s' "refs/tags/$RELEASE_TAG" > "$CHANGELOG_FILE"
          fi
          echo "file=$CHANGELOG_FILE" >> "$GITHUB_OUTPUT"

      - name: Add permission
        run: chmod +x ./gradlew

      - name: Ensure jar in fml-loom cache
        run: |
          set -euo pipefail
          MITE_VER="1.6.4-MITE"
          GRADLE_USER_HOME="${GRADLE_USER_HOME:-$HOME/.gradle}"
          CACHE_DIR="$GRADLE_USER_HOME/caches/fml-loom/$MITE_VER"
          TARGET_JAR="$CACHE_DIR/$MITE_VER.jar"

          mkdir -p "$CACHE_DIR"

          if [ -f "$TARGET_JAR" ]; then
            echo "Found $TARGET_JAR, skipping download."
            exit 0
          fi

          DOWNLOAD_URL="https://maven.limingzxc.top/repository/maven-releases/com/mojang/minecraft/$MITE_VER/minecraft-$MITE_VER.jar"

          echo "Downloading $DOWNLOAD_URL ..."
          # download to temp file then move into place
          curl -fSL "$DOWNLOAD_URL" -o "$TARGET_JAR.tmp"
          mv "$TARGET_JAR.tmp" "$TARGET_JAR"
          echo "Saved $TARGET_JAR"

      - name: Execute Gradle build
        run: ./gradlew "-Pmod_version=${{ steps.version.outputs.value }}" build

      - uses: Kir-Antipov/mc-publish@v3.3.0
        with:
          # Only include this section if you wish to publish
          # your assets on Modrinth.
          modrinth-id: C9l91xbG
          modrinth-token: ${{ secrets.MODRINTH_TOKEN }}

          # Only include this section if you wish to publish
          # your assets on CurseForge.
#          curseforge-id: placeholder
#          curseforge-token: ${{ secrets.CURSEFORGE_TOKEN }}

          files: |
            build/libs/!(*-@(dev|sources|javadoc)).jar
            build/libs/*-@(dev|sources|javadoc).jar
          loaders: LegacyFabric
          game-versions: 1.6.4
          java: |
            17
          name: ${{ steps.version.outputs.value }}
          version: ${{ steps.version.outputs.value }}
          changelog-file: ${{ steps.changes.outputs.file }}
